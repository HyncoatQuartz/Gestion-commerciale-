<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyncoat - Gestion Commerciale</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        header { background: #1e293b; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #f8fafc; }
    </style>
</head>
<body>

    <header>
        <h1>Hyncoat - Gestion Commerciale & Stock</h1>
    </header>

    <div class="container">
        <h2>Importer une Facture Fournisseur</h2>
        <div class="form-group">
            <label for="importData">Coller ou charger les lignes de la facture (Format texte / CSV : Référence, Désignation, Quantité, Prix TTC)</label>
            <textarea id="importData" rows="6" placeholder="Exemple : REF001, Peinture Blanche Sikkens, 10, 120.00"></textarea>
        </div>
        <button onclick="traiterImportFacture()">Traiter et Mettre à jour le Stock</button>
    </div>

    <div class="container">
        <h2>Inventaire du Stock (Prix en HT - TVA 20%)</h2>
        <table id="stockTable">
            <thead>
                <tr>
                    <th>Référence</th>
                    <th>Désignation</th>
                    <th>Quantité Stock</th>
                    <th>Prix Unitaire HT (DH)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Les articles s'afficheront ici -->
            </tbody>
        </table>
    </div>

    <script>
        // Charger le stock initial depuis le stockage local ou initialiser un tableau vide
        let stockArticles = JSON.parse(localStorage.getItem('hyncoat_stock')) || [];

        function afficherStock() {
            let tbody = document.querySelector('#stockTable tbody');
            tbody.innerHTML = '';
            
            if (stockArticles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b;">Aucun article en stock pour le moment.</td></tr>`;
                return;
            }

            stockArticles.forEach(article => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${article.reference}</td>
                    <td>${article.designation}</td>
                    <td>${article.stock}</td>
                    <td>${article.prixHT.toFixed(2)} DH</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function traiterImportFacture() {
            let texteBrut = document.getElementById('importData').value.trim();
            if (!texteBrut) {
                alert("Veuillez entrer ou coller les données de la facture.");
                return;
            }

            let lignes = texteBrut.split('\n');
            let nbImportes = 0;

            lignes.forEach(ligneStr => {
                // Sépare par virgule, point-virgule ou tabulation
                let colonnes = ligneStr.split(/[,;\t]/);
                if (colonnes.length >= 4) {
                    let reference = colonnes[0].trim();
                    let designation = colonnes[1].trim();
                    let quantiteAjout = parseFloat(colonnes[2].trim()) || 0;
                    let prixTTC = parseFloat(colonnes[3].trim()) || 0;

                    // Application automatique de la TVA à 20% pour trouver le Prix HT
                    // Formule : Prix HT = Prix TTC / 1.20
                    let prixHT = prixTTC / 1.20;

                    // Vérifier si l'article existe déjà dans le stock
                    let articleExistant = stockArticles.find(a => a.reference.toLowerCase() === reference.toLowerCase());

                    if (articleExistant) {
                        // Mise à jour de la quantité et du dernier prix d'achat HT
                        articleExistant.stock += quantiteAjout;
                        articleExistant.prixHT = prixHT;
                        articleExistant.designation = designation; // Met à jour le nom si besoin
                    } else {
                        // Ajout d'un nouvel article
                        stockArticles.push({
                            reference: reference,
                            designation: designation,
                            stock: quantiteAjout,
                            prixHT: prixHT
                        });
                    }
                    nbImportes++;
                }
            });

            // Sauvegarde dans le navigateur (localStorage)
            localStorage.setItem('hyncoat_stock', JSON.stringify(stockArticles));

            // Actualisation de l'affichage
            afficherStock();
            document.getElementById('importData').value = '';
            alert(`Importation réussie ! ${nbImportes} ligne(s) traitée(s) et convertie(s) en HT (TVA 20%).`);
        }

        // Afficher le stock au chargement de la page
        window.onload = afficherStock;
    </script>
</body>
</html>
